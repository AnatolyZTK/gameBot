name: gameparser

x-panther-env: &panther-env
  HOME: /tmp
  PANTHER_NO_SANDBOX: "1"
  PANTHER_ERROR_SCREENSHOT_DIR: /tmp/panther-error-screenshots

x-php-build: &php-build
  context: .
  dockerfile: docker/php/Dockerfile
  target: ${DOCKER_PHP_TARGET:-dev}

x-php-volumes: &php-volumes
  - ./:/var/www/html
  - ./docker/php/conf.d/app.ini:/usr/local/etc/php/conf.d/99-app.ini:ro

x-php-environment: &php-environment
  <<: *panther-env
  APP_ENV: ${APP_ENV:-dev}
  APP_SECRET: ${APP_SECRET:-change_me_in_production}
  DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-app}@mysql:3306/${MYSQL_DATABASE:-app}?serverVersion=8.0.32&charset=utf8mb4
  REDIS_URL: redis://redis:6379
  MANTICORE_HOST: manticore
  MANTICORE_PORT: 9308
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-app-storage}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  S3_USE_PATH_STYLE: "true"

x-php-service: &php-service
  build: *php-build
  shm_size: "2gb"
  volumes: *php-volumes
  environment: *php-environment
  networks:
    - app

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_started
    networks:
      - app

  init:
    <<: *php-service
    command: ["/bin/sh", "/var/www/html/docker/php/init.sh"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  php:
    <<: *php-service
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      manticore:
        condition: service_started
      minio:
        condition: service_started

  worker:
    <<: *php-service
    command: ["xvfb-run", "-a", "php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=512M"]
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  scheduler:
    <<: *php-service
    command: ["php", "bin/console", "scheduler:consume", "--time-limit=3600"]
    depends_on:
      init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    profiles:
      - scheduler

  mysql:
    # 8.4+ требует x86-64-v2 (SSE3/POPCNT); на старых CPU/VM — 8.0.32
    image: mysql:8.0.32
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER:-app}", "-p${MYSQL_PASSWORD:-app}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app

  manticore:
    image: manticoresearch/manticore:6.3.8
    ports:
      - "${MANTICORE_HTTP_PORT:-9308}:9308"
      - "${MANTICORE_MYSQL_PORT:-9306}:9306"
    volumes:
      - manticore_data:/var/lib/manticore
      # без :ro — entrypoint делает chown на конфиг при старте
      - ./docker/manticore/manticore.conf:/etc/manticoresearch/manticore.conf
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - app

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app

  minio:
    # свежие релизы требуют x86-64-v2; этот tag работает на baseline x86-64
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - app

  minio-init:
    # tag RELEASE.2023-03-23... на Hub отсутствует; -cpuv1 = baseline x86-64
    image: minio/mc:RELEASE.2023-12-20T07-14-22Z-cpuv1
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb -p local/$${S3_BUCKET} || true;
      mc anonymous set download local/$${S3_BUCKET}/public || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-app-storage}
    restart: "no"
    networks:
      - app

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
  mysql_data:
  manticore_data:
  redis_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
  minio_data:

networks:
  app:
    driver: bridge
