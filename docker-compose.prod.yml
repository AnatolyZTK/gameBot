# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# или: COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml make deploy

services:
  nginx:
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd:ro

  php:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      SKIP_COMPOSER: "1"

  worker:
    restart: always
    environment:
      APP_ENV: prod
      SKIP_COMPOSER: "1"
      PANTHER_NO_HEADLESS: "0"
      # пустой DISPLAY → entrypoint поднимет Xvfb :99
      DISPLAY: ""
      XVFB_DISPLAY: ":99"

  init:
    environment:
      APP_ENV: prod
      COMPOSER_FLAGS: --no-dev --optimize-autoloader

  mysql:
    restart: unless-stopped
    # Только внутри Docker-сети — на хост не торчит
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  minio:
    restart: unless-stopped
    ports: !reset []

  manticore:
    restart: unless-stopped
    ports: !reset []
