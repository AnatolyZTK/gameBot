# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# или: COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml make deploy

services:
  nginx:
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

  php:
    restart: unless-stopped
    environment:
      APP_ENV: prod

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: prod

  init:
    environment:
      APP_ENV: prod
      COMPOSER_FLAGS: --no-dev --optimize-autoloader

  mysql:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  minio:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  manticore:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MANTICORE_HTTP_PORT:-9308}:9308"
      - "127.0.0.1:${MANTICORE_MYSQL_PORT:-9306}:9306"
