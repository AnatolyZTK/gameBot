# Production overlay: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# или: COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml make deploy

services:
  nginx:
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

  php:
    restart: unless-stopped
    environment:
      APP_ENV: prod

  worker:
    restart: unless-stopped
    environment:
      APP_ENV: prod
      PANTHER_NO_HEADLESS: "0"
      DISPLAY: ""

  init:
    environment:
      APP_ENV: prod
      COMPOSER_FLAGS: --no-dev --optimize-autoloader

  mysql:
    restart: unless-stopped
    # Только внутри Docker-сети — на хост не торчит
    ports: !reset []

  redis:
    restart: unless-stopped
    ports: !reset []

  minio:
    restart: unless-stopped
    ports: !reset []

  manticore:
    restart: unless-stopped
    ports: !reset []
